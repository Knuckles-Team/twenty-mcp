[build-system]
requires = [ "setuptools>=80.9.0", "wheel",]
build-backend = "setuptools.build_meta"

[project]
name = "twenty-mcp"
version = "2.1.0"
description = "Twenty CRM REST/GraphQL MCP Server for Agentic AI!"
readme = "README.md"
classifiers = [ "Development Status :: 4 - Beta", "License :: OSI Approved :: MIT License", "Environment :: Console", "Operating System :: POSIX :: Linux", "Programming Language :: Python :: 3",]
requires-python = ">=3.12, <3.15"
# NOTE (EH-484 policy update, see /var/tmp/l9/finish/au-decon-G4e/SDK-GAPS.md gaps
# #0 and #1): agent-utilities is kept for kg_ingest.py's native_ingest import (no
# EG-client ingest facade exists yet -- no fail-closed stub) and for
# mcp/mcp_graphql.py's ctx_graphql_list_types/ctx_graphql_get_type_details (not
# extracted into agent_connector_sdk at all -- no vendored shim). Drop
# agent-utilities once both gaps land.
dependencies = [ "agent-connector-sdk>=0.1.0,<1.0.0", "agent-utilities>=2.0.0,<3.0.0", "gql>=4.0.0", "httpx>=0.28.1",]
[[project.authors]]
name = "Project Maintainers"
email = "maintainers@users.noreply.github.com"

[project.license]
text = "MIT"

[project.optional-dependencies]
gql = [ "gql>=4.0.0",]
test = [ "pytest-xdist>=3.8.0", "pytest>=9.1.1", "pytest-asyncio>=1.4.0", "pytest-cov>=7.1.0",]

[project.scripts]
twenty-mcp = "twenty_mcp.mcp_server:mcp_server"

[project.entry-points."agent_utilities.skill_providers"]
twenty-mcp = "twenty_mcp.skills"

[project.entry-points."agent_utilities.ontology_providers"]
twenty-mcp = "twenty_mcp.ontology"

[project.entry-points."agent_utilities.source_connector_providers"]
twenty-mcp = "twenty_mcp.connectors"

[project.entry-points."agent_utilities.prompt_providers"]
twenty-mcp = "twenty_mcp.prompts"

[tool.uv.workspace]
members = ["."]

[tool.setuptools]
include-package-data = true

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true

[dependency-groups]
dev = [ "pytest-timeout>=2.4.0",]

[tool.setuptools.package-data]
twenty_mcp = [ "mcp_config.json", "prompts/**", "skills/**", "ontology/**", "connectors/**",]

[tool.ruff.lint]
select = [ "E", "F", "I", "UP", "B",]
ignore = [ "E402", "E501", "B008",]

[tool.setuptools.packages.find]
where = [ ".",]

[tool.uv]
override-dependencies = [
    "fastmcp-slim[client,server]>=4.0.0b1",
]

[tool.uv.sources]
agent-connector-sdk = { path = ".uv-workspace-siblings/agent-connector-sdk", editable = true }
agent-utilities = { path = ".uv-workspace-siblings/agent-utilities", editable = true }
